<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundgang</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8e8e8; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; z-index: 2; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #title { font-weight: 600; font-size: 16px; }
  #subtitle { color: #b8b8b8; }
  #links { display: flex; gap: 6px; margin-left: auto; }
  #menu { position: fixed; top: 52px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 24px); z-index: 2; }
  button, a.btn { background: rgba(20,22,26,.85); color: #e8e8e8; border: 1px solid #3a3f47; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { border-color: #8ab4f8; }
  #menu button.active { background: #8ab4f8; color: #0b0d10; border-color: #8ab4f8; }
  #hud { position: fixed; right: 12px; bottom: 44px; z-index: 2; display: flex; gap: 6px; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(20,22,26,.9); padding: 14px 18px; border-radius: 8px; z-index: 3; display: none; text-align: center; }
  #status img { display: block; max-width: 60vw; max-height: 40vh; margin: 0 auto 10px; border-radius: 6px; opacity: .8; }
  #help { position: fixed; left: 12px; bottom: 44px; background: rgba(20,22,26,.75); padding: 8px 12px; border-radius: 6px; z-index: 2; color: #c8c8c8; }
  #footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(20,22,26,.85); color: #b8b8b8; font-size: 12px; z-index: 2; }
  #footer a { color: #8ab4f8; }
  @media (max-width: 640px) { #help { display: none; } #links { margin-left: 0; } #menu { top: 96px; } }
</style>
</head>
<body>
<div id="top">
  <span id="title"></span>
  <span id="subtitle"></span>
  <span id="links"></span>
</div>
<div id="menu"></div>
<div id="hud"><button id="reset">Ansicht zurücksetzen</button></div>
<div id="help">Maus ziehen: umsehen · W A S D / Pfeile: gehen · Q / E: runter / hoch · Touch: 1 Finger umsehen, 2 Finger gehen</div>
<div id="status">Lade…</div>
<div id="footer">KI-Impression auf Basis der Inserat-Fotos, nicht das echte Schiff: alles ausserhalb des jeweiligen Fotos ist vom Modell ergänzt. <a id="source" href="#" target="_blank" rel="noopener">Zum Inserat</a></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const ROOM_DIR = "rooms/";
const EXT = ".spz";
const status = document.getElementById("status");

const boat = await fetch("boat.json?v=" + Date.now()).then(r => r.json());
document.title = boat.title + " Rundgang";
document.getElementById("title").textContent = boat.title;
document.getElementById("subtitle").textContent = boat.subtitle || "";
const links = document.getElementById("links");
if (boat.source) { document.getElementById("source").href = boat.source; }
for (const t of boat.tours || []) {
  const a = document.createElement("a"); a.className = "btn"; a.target = "_blank"; a.rel = "noopener"; a.href = t;
  a.textContent = t.includes("matterport") ? "Echter 3D-Rundgang (Matterport)" : "Virtuelle Tour";
  links.appendChild(a);
}
const ROOMS = boat.rooms || [];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new SparkRenderer({ renderer }));

// First-person state. yaw/pitch in radians, position in world units (metres for Marble rooms, roughly metres for FlashWorld).
const state = { yaw: 0, pitch: 0, pos: new THREE.Vector3(0, 0, 0), keys: new Set() };
let activeRoom = null;
function resetView() {
  const s = activeRoom?.start || [0, 0, 0];
  state.yaw = THREE.MathUtils.degToRad(activeRoom?.yaw || 0); state.pitch = 0; state.pos.set(s[0], s[1], s[2]);
}
function applyCamera() {
  camera.position.copy(state.pos);
  camera.quaternion.setFromEuler(new THREE.Euler(state.pitch, state.yaw, 0, "YXZ"));
}

// Mouse look
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") { dragging = true; lastX = e.clientX; lastY = e.clientY; } });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  state.yaw   -= (e.clientX - lastX) * 0.0035;
  state.pitch -= (e.clientY - lastY) * 0.0035;
  state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch));
  lastX = e.clientX; lastY = e.clientY;
});

// Touch: one finger look, two fingers move
const touches = new Map();
renderer.domElement.addEventListener("touchstart", e => { for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY }); e.preventDefault(); }, { passive: false });
renderer.domElement.addEventListener("touchend", e => { for (const t of e.changedTouches) touches.delete(t.identifier); });
renderer.domElement.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0], p = touches.get(t.identifier); if (!p) return;
    state.yaw   -= (t.clientX - p.x) * 0.005;
    state.pitch -= (t.clientY - p.y) * 0.005;
    state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch));
    touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  } else if (e.touches.length === 2) {
    let dx = 0, dy = 0;
    for (const t of e.touches) { const p = touches.get(t.identifier); if (!p) continue; dx += t.clientX - p.x; dy += t.clientY - p.y; touches.set(t.identifier, { x: t.clientX, y: t.clientY }); }
    moveRelative(dx * 0.002, -dy * 0.002);
  }
}, { passive: false });

// Keyboard walk
addEventListener("keydown", e => { state.keys.add(e.key.toLowerCase()); if (e.key.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup",   e => state.keys.delete(e.key.toLowerCase()));
function moveRelative(strafe, forward, up = 0) {
  const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw);
  const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw);
  state.pos.addScaledVector(dir, forward).addScaledVector(right, strafe);
  state.pos.y += up;
}
let last = performance.now();
function walk(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = 0.9 * dt;
  const k = state.keys;
  let f = 0, s = 0, u = 0;
  if (k.has("w") || k.has("arrowup")) f += 1;
  if (k.has("s") || k.has("arrowdown")) f -= 1;
  if (k.has("a") || k.has("arrowleft")) s -= 1;
  if (k.has("d") || k.has("arrowright")) s += 1;
  if (k.has("q")) u -= 1;
  if (k.has("e")) u += 1;
  if (f || s || u) moveRelative(s * speed, f * speed, u * speed);
}

// Room loading
let current = null;
async function loadRoom(room) {
  status.innerHTML = (room.preview ? `<img src="${room.preview}?v=${room.version || 0}" alt="">` : "") + `Lade ${room.label}…`;
  status.style.display = "block";
  if (current) { scene.remove(current); current.dispose?.(); current = null; }
  const mesh = new SplatMesh({ url: ROOM_DIR + room.id + EXT + (room.version ? "?v=" + room.version : "") });
  // FlashWorld exports OpenGL world coordinates, matching Three.js: no extra rotation.
  // Marble exports in its raw OpenCV frame (Y down, Z forward): half turn about X, then metric scale.
  if (room.frame === "marble_raw_opencv") mesh.rotation.x = Math.PI;
  if (room.scale) mesh.scale.setScalar(room.scale);
  if (room.offset) mesh.position.set(room.offset[0], room.offset[1], room.offset[2]);
  scene.add(mesh);
  current = mesh;
  activeRoom = room;
  resetView();
  try { await mesh.initialized; } catch (err) { status.textContent = `Fehler beim Laden: ${err}`; return; }
  status.style.display = "none";
  for (const b of document.querySelectorAll("#menu button")) b.classList.toggle("active", b.dataset.id === room.id);
  history.replaceState(null, "", "#" + room.id);
}

const menu = document.getElementById("menu");
for (const room of ROOMS) {
  const b = document.createElement("button");
  b.textContent = room.label; b.dataset.id = room.id;
  b.onclick = () => loadRoom(room);
  menu.appendChild(b);
}
document.getElementById("reset").onclick = resetView;
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

renderer.setAnimationLoop(now => { walk(now); applyCamera(); renderer.render(scene, camera); });

if (ROOMS.length) {
  const fromHash = ROOMS.find(r => "#" + r.id === location.hash);
  loadRoom(fromHash || ROOMS[0]);
} else {
  status.textContent = "Keine Räume vorhanden."; status.style.display = "block";
}
</script>
</body>
</html>
